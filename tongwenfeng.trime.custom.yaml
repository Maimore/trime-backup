# Trime custom settings
# encoding: utf-8

patch:
  "preset_keyboards/default/label_transform": uppercase
  style/+:
    key_border: 1 #边框线宽
    keyboard_padding_bottom: 15 #竖屏底边距
    horizontal_gap: 5 #按键竖缝
    vertical_gap: 7 #按键横缝
    key_press_offset_x: 2 #按下横向偏移
    key_press_offset_y: 2 #按下纵向偏移
    key_text_offset_y: 1 #按键文字上下偏移
    key_symbol_offset_y: 3 #上标上下偏移
    round_corner: 10 #按键圆角半径
    candidate_corner_radius: 9 #候选背景块圆角
    candidate_border: 1 #候选区边框线宽
    candidate_border_round: 10 #候选区边框圆角
  preset_color_schemes/default/+:
    key_border_color: 0x66000000 #按键边框
    hilited_candidate_back_color: 0xff0080ff
    hilited_candidate_text_color: 0xffffffff
    candidate_border_color: 0x66000000 #悬浮窗边框

  window:
    insets:                    #窗口内边距
      vertical: 4              #纵向内边距（整数）
      horizontal: 4           #横向内边距（整数）
    item_padding:            #候选项内边距
      vertical: 7              #纵向内边距（整数）
      horizontal: 11          #横向内边距（整数）
    corner_radius: 11         #圆角半径（浮点）
    alpha: 0.9                #透明度（0-1，浮点）
    border: 1                 #边框宽度（整数）
    shadow: 3                #阴影半径（浮点）
    foreground:               #前景样式
      label_font_size: 13      #序号字体大小（浮点）
      text_font_size: 20       #文字字体大小（浮点）
      comment_font_size: 10  #注释字体大小（浮点）

  tool_bar/+:
    undo: &undo
      foreground:
        style: "ic@undo"
      action: undo
    redo: &redo
      foreground:
        style: "ic@redo"
      action: redo
    buttons/+: 
      - *redo
      - *undo
