  Netdisk: {label: "\uE05f", send: FUNCTION, command: run, option: "http://trime365.ysepan.com"} #网盘
  Bing: {label: "\uE1A2", send: FUNCTION, command: run, option: "http://cn.bing.com/search?q=%s"} 
  Hand_writing: {label: "\uE06A", send: FUNCTION, command: run, option: "https://chinesehandwritinggpt.com/zhs"} #必应
  MT: {label: "\uE67B", send: FUNCTION, command: run, option: "bin.mt.plus"} #MT管理器
  File_explorer: {label: "\uE67C", send: FUNCTION, command: run, option: "com.android.fileexplorer"}
  Notes: {label: "\uE1A7", send: FUNCTION, command: run, option: "com.miui.notes"} #笔记
  Weixin: {label: "\uE5FF", send: FUNCTION, command: run, option: "com.tencent.mm"} #微信
  Alipay: {label: "\uE63F", send: FUNCTION, command: run, option: "com.eg.android.AlipayGphone"}
  Jingdong: {label: "\uE653", send: FUNCTION, command: run, option: "com.jd.waimai"} #京东
  # Meituan: {label: "\uE641", send: FUNCTION, command: run, option: "com.sankuai.meituan.takeoutnew"} #美团
  Taobao: {label: "\uE642", send: FUNCTION, command: run, option: "com.taobao.taobao"} 
  huibao: {label: "\uE05A", send: FUNCTION, command: run, option: "https://www.workbuddy.link/p/t5o9uJeVVKJHxnXObu6LS9?fromMpSh=1"}
  
