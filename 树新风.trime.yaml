# Trime default style settings
# encoding: utf-8

config_version: "5.6"
name: "树新风"
author: "讲文明"

#颜色
colors:
  ⓧ: &透明 0x00
  ◯: &白 0xffffffff
  ⚫: &黑 0xff000000
  ⚫: &黑40% 0x66000000
  ⚪: &浅灰 0xffeeeeee
  ⚪: &中灰 0xffc9cdd8
  🔵: &亮蓝 0xff0d80f2

#配色方案
preset_color_schemes:
  default:
    name: "没的选"
    keyboard_back_color: *浅灰 #键盘背景
  #按键
    key_border_color: *黑40% #按键边框
    key_text_color: *黑 #按键文本
    key_symbol_color: *黑40% #按键符号
    key_back_color: *白 #按键背景
    hilited_key_text_color: *黑 #高亮按键文本
    hilited_key_symbol_color: *黑40% #高亮按键符号
    hilited_key_back_color: *浅灰 #高亮按键背景
  #功能键
    off_key_text_color: *黑 #功能键文本
    off_key_back_color: *中灰 #功能键背景
    on_key_back_color: *浅灰 #功能键锁定背景
    on_key_text_color: *黑 #功能键锁定文本
    hilited_off_key_text_color: *黑 #高亮键文本
    hilited_off_key_back_color: *浅灰 #高亮键背景
    blue_key: {key_back_color: *亮蓝, hilited_key_back_color: *浅灰, key_text_color: *白, hilited_key_text_color: *黑}
  #编码
    text_color: *亮蓝 #编码
    text_back_color: *白 #编码/浮窗背景
    hilited_text_color: *亮蓝 #高亮编码
  #候选
    back_color: *浅灰 #候选区背景
    candidate_border_color: *黑40% #候选/浮窗边框
    candidate_separator_color: *浅灰 #候选分割线
    candidate_text_color: *黑 #候选文本
    label_color: *黑40% #候选序号
    hilited_candidate_back_color: *亮蓝 #高亮背景
    hilited_candidate_text_color: *白 #高亮文本
    comment_text_color: *黑40% #提示
    hilited_comment_text_color: *黑 #高亮提示
  #气泡
    popup_back_color: *浅灰 #气泡背景
    hilited_popup_back_color: *白 #高亮气泡背景
    hilited_popup_text_color: *亮蓝 #高亮气泡文字

#保留一项，防止其他主题使用__include时无法加载
fallback_colors: #后备配色
  candidate_background: key_back_color #候选栏背景
  # root_background: keyboard_back_color # 整个键盘区+候选栏的背景图/色
  # long_text_back_color: text_back_color #长文本按键的背景(剪贴板）

#界面风格、功能开关
style:
#候选
  candidate_text_size: 20 #候选字号
  candidate_padding: 17 #候选项内边距
  candidate_spacing: 0.5 #候选间隔线宽
  candidate_view_height: 25 #候选区高度
  candidate_corner_radius: 14 #候选项圆角半径
  candidate_text_vertical_bias: 0.5 #候选垂直偏移
  candidate_border: 1 #候选区边框线宽
  candidate_border_round: 15 #候选区边框圆角
#提示
  comment_text_size: 7 #提示字号
  comment_height: 10 #（调节候选上下空间）
  comment_position: overlay #位置right/top/overlay
  comment_vertical_bias: 1.1 #提示垂直偏移
#按键
  key_width: 10 #键宽
  key_height: 40 #键高
  key_text_size: 22 #按键字号
  symbol_text_size: 10 #按键符号字号
  key_long_text_size: 19 #长标签字号
  key_border: 1 #按键边框宽度
  round_corner: 11 #按键圆角半径
  key_text_offset_x: 0 #按键文字左右偏移
  key_text_offset_y: 0 #按键文字上下偏移
  key_symbol_offset_x: 10 #上标左右偏移
  key_symbol_offset_y: 5 #上标上下偏移
  key_hint_offset_x: 0 #下标左右偏移
  key_hint_offset_y: -6 #下标上下偏移
  key_press_offset_x: 1.5 #按下横向偏移
  key_press_offset_y: 1.5 #按下纵向偏移
#键盘
  reset_ascii_mode_on_focus_change: false #焦点变更弹起软键盘时重置 ascii_mode
  horizontal_gap: 4 #按键间距
  vertical_gap: 5 #按键行距
  keyboard_height: 250 #锁定键盘高度
  keyboard_height_land: 200 #锁定横屏键盘高度
  keyboard_padding_bottom: 18 #竖屏底边距
  keyboard_padding_land_bottom: 10 #横屏底边距
  keyboard_padding: 0 #竖屏两侧边距
  keyboard_padding_land: 90 #横屏两侧边距
#[字体]
  key_font: [iconfont.ttf] #按键字体
  symbol_font: [iconfont.ttf] #符号字体
  popup_font: [iconfont.ttf] #气泡字体
#气泡
  popup_width: 40 #气泡宽度
  popup_height: 40 #preview气泡高度
  popup_key_height: 42 #内键气泡高度
  popup_bottom_margin: 70 #气泡标高
  popup_text_size: 22 #气泡字号

#预编辑文本
preedit:
  horizontal_padding: 8 #横向内边距（整数）
  alpha: 1 #透明度（0-1，浮点）
  top_end_radius: 5 #末上端圆角（浮点）
  foreground: #前景样式
    font_size: 16 #预编辑字体大小（浮点）
 
#悬浮窗
window:
  insets: #窗口内边距
    vertical: 5 #纵向（整数）
    horizontal: 6 #横向（整数）
  item_padding: #候选项内边距
    vertical: 7 #纵向（整数）
    horizontal: 11 #横向（整数）
  foreground: #前景样式
    label_font_size: 13 #序号字体大小（浮点）
    text_font_size: 20 #文字字体大小（浮点）
    comment_font_size: 10 #注释字体大小（浮点）
  min_width: 20 #最小宽度（整数）
  corner_radius: 17 #圆角半径（浮点）
  alpha: 0.85 #透明度（0-1，浮点）
  border: 1 #边框宽度（整数）
  shadow: 0 #阴影半径（浮点）

#工具栏
tool_bar:
  button_spacing: 14 #按钮间距
  button_font: [iconfont.ttf] #按钮字体
  back_style: "ic@menu-left" #返回按钮样式
#左侧固定主按钮
  primary_button: 
    background:  #背景样式设置
      type: rectangle #高亮形状(可选:circle|rectangle)
      corner_radius: 40 #圆角半径
      normal: *透明 #正常状态背景颜色
      highlight: *浅灰 #高亮状态背景色
      vertical_inset: 6 #垂直方向内缩量
      horizontal_inset: 10 #水平方向内缩量
    foreground:  #前景内容设置
      style: "" #（内置图标以ic@开头）前景样式为空，将显示为 action 的 label
      # normal: *黑 #正常状态前景色
      # highlight: *黑40% #高亮状态前景色
      # padding: 0 #前景内容与背景边界的内边距
      font_size: 24 #字体尺寸
    size: [53, 40] #视图组件整体宽高
    action: menu_keyboard #按钮点击事件
    long_press_action: Settings #按钮长按事件
#隐藏键盘
  hide: &hide
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
      vertical_inset: 6 #垂直方向内缩量
      horizontal_inset: 8 #水平方向内缩量
    foreground:
      style: "ic@menu-down"
      font_size: 17
    size: [43, 40]
    action: Hide
#符号&扩展符号
  yingfu: &yingfu
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: ""
      font_size: 21
    action: liquid_keyboard_ascii
    long_press_action: Keyboard_symbols
#剪贴板
  clip: &clip
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: ""
      font_size: 21
    action: clipboard_window
    long_press_action: favorites
#恢复
  redo: &redo
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: ""
      font_size: 20
    action: redo
#撤消
  undo: &undo
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: ""
      font_size: 20
    action: undo
#键盘布局&方案菜单
  layout: &layout
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: ""
      font_size: 23
    action: Keyboard_layout
    long_press_action: Menu
#中/英切换
  toggle: &toggle
    background:
      type: {__include: /tool_bar/primary_button/background/type} #跟随主按钮背景高亮形状
      corner_radius: {__include: /tool_bar/primary_button/background/corner_radius} #跟随主按钮背景圆角
      highlight: {__include: /tool_bar/primary_button/background/highlight} #跟随主按钮背景高亮
      vertical_inset: {__include: /tool_bar/primary_button/background/vertical_inset}#垂直内缩
    foreground:
      style: "\uE076"
      font_size: 23
    action: Keyboard_ascii
#右侧按钮列表（从右向左排列）
  buttons: [*hide, *yingfu, *clip, *redo, *undo, *layout, *toggle]

#液态键盘
liquid_keyboard:
  single_width: 69    #按键宽度
  margin_x: 4        #按键间隙
  fixed_key_bar:      #固定按键条
    position: bottom  #摆放位置 top|bottom|left|right
    keys:             #按键（显示对应的label）
      - liquid_keyboard_exit
      - liquid_keyboard_clipboard
      - liquid_keyboard_tabs
      - liquid_keyboard_backspace
      - liquid_keyboard_return
  keyboards: [ascii, cn, unit, math, ordinal, pinyin, symbol, script_symbols, grease, rusa, yinbiao, symbollist, tabs]  #tab列表
  tabs:
    name: 更多
    type: TABS
  math:   #tab名称
    type: SINGLE
    name: 数学
    keys: "≈＝≠≌<>≤≥≡()[]{}-+±×*/÷&∥%‰‱°′″∫∮∯∬∭∰∞∑∧∏∈∵∴⊥∝∨∪•√〒∝∽∈∩∧⊙⌒∥∟∣∂∆∞≌∉∪∨⊕⊿⊥∠∫∬∭"  #tab中的按键列表
  ascii:
    type: SINGLE
    name: 英文
    keys: ",.?!:;/\\|*+-=_$`'\"^~@#%&()[]{}"
  cn:
    type: SINGLE
    name: 中文
    keys: [；, ：, 、, ·, ……, ——, “, ”, ‘, ’, （, ）, 《, 》, 【, 】, ［, ］, ｛, ｝, 「, 」, 『, 』]

  symbol:
    name: 特殊
    type: SINGLE
    keys: "㞢△▽○◇□☆▲▼●◆■★▷◁▶◀♻♲†⚝✡⚹✦✸✹￼�×⌫☑☒✔✘✓✗☼☽☾◑◐㏂㏘☭♀♂☹☻☠☜☞☚☟☛▪•‥…∷※♩♪♫♬§°♭♯♮‖¶№◎¤۞℗®©卍卐℡™㏇Φ⇦⇧⇨⇩⇪↖↑↗←↔→↙↓↘⇄⇅⇆⇤↩⇥▸◂▴▾◤◥◣◢㊤㊧㊥㊨㊦❏❐◲〼▢▣↶✁↷✍⏍ϟ✎✆☱☰☴⚿⛮⚙☲☯☵⛶☩☐☳☷☶⟲ღ✈☂𮯰"
  unit:
    name: 单位
    type: SINGLE
    keys: "℃¥$€฿￡㎡m³℉￥£￠₠¹²³⁴⁵ⁿ⁶⁷⁸⁹⁰ˣ⁺⁻⁼⁽⁾½⅓¼⅔¾₁₂₃₄₅ₙ₆₇₈₉₀ₓ₊₋₌₍₎℅"
  ordinal:
    name: 序号
    type: SINGLE
    keys: "①②③④⑤⑥⑦⑧⑨⑩⒈⒉⒊⒋⒌⒍⒎⒏⒐⒑⒒⒓⒔⒕⒖⒗⒘⒙⒚⒛⑴⑵⑶⑷⑸⑹⑺⑻⑼⑽⑾⑿⒀⒁⒂⒃⒄⒅⒆⒇㈠㈡㈢㈣㈤㈥㈦㈧㈨㈩➊➋➌➍➎➏➐➑➒➓㊀㊁㊂㊃㊄㊅㊆㊇㊈㊉ⅰⅱⅲⅳⅴⅵⅶⅷⅸⅹⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ"
  pinyin:
    name: 拼音
    type: SINGLE
    keys: "āáǎàōóēéěèǒòīíǐìūúǖǘǚǜǔùêüńňㄚㄛㄜㄧㄨㄩㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ"
  script_symbols:
    name: 𝒶𝒜
    type: SINGLE
    keys: "𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵"
  grease:
    type: SINGLE
    name: 希腊
    keys: "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩαβγδεζηθικλμνξοπρστυφχψω"
  rusa:
    name: 俄语
    type: SINGLE
    keys: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя"
  yinbiao:
    type: SINGLE
    name: "音标"
    keys: ["a:", "ɔ:", "ɜː", "i:", "u:", "ʌ", "ɒ", "ə", "ɪ", "ʊ", "e", "æ", "eɪ", "aɪ", "ɔɪ", "ɪə", "eə", "ʊə", "əʊ", "aʊ", "p", "t", "k", "f", "θ", "s", "b", "d", "g", "v", "ð", "z", "ʃ", "h", "ts", "tʃ", "j", "tr", "ʒ", "r", "dz", "dʒ", "dr", "w", "m", "n", "ŋ", "l"]
  symbollist:
    type: SYMBOL
    name: 扩符
    keys: [ 符号: '/fh', 电脑: '/dn', 象棋: '/xq', 麻将: '/mj', 骰子: '/sz', 扑克: '/pk', 天气: '/tq', 音乐: '/yy', 八卦: '/bg', 易经: '/lssg', 天体: '/tt',  星座: '/xz',  星号: '/xh',  方块: '/fk',  几何: '/jh',  箭头: '/jt',  数学: '/sx',  上标: '/sb',  下标: '/xb',  单位: '/dw',  货币: '/hb',  拼音: '/py',  注音: '/zy',  假名: '/jm',  片假: '/pjm',  韩文: '/hw',  希腊: '/xl',  希大: '/xld', 罗马:   '/lm',  罗大:   '/lmd', 俄语:   '/ey',  俄大:   '/eyd', 表情:  '/bq',  一: '/1',  二: '/2',  三: '/3',  四: '/4',  五: '/5',  六: '/6',  七: '/7',  八: '/8',  九: '/9',  零: '/0',  十: '/10',  分数: '/fs',  标点: '/bd',  偏旁: '/pp',  竖标:  '/bdz'  ]

#键盘布局
preset_keyboards:
  default:
    author: "暖暖"
    ascii_mode: 0
    ascii_keyboard: ascii
    width: 10
    lock: true
    keys:
    #第一行
      - {click: q, long_click: 1}
      - {click: w, long_click: 2}
      - {click: e, long_click: 3}
      - {click: r, long_click: 4}
      - {click: t, long_click: 5}
      - {click: y, long_click: 6}
      - {click: u, long_click: 7}
      - {click: i, long_click: 8}
      - {click: o, long_click: 9}
      - {click: p, long_click: 0}
    #第二行
      - {click: Left, popup: [Pin, Forward], width: 5, key_back_color: *透明, key_border: 0}
      - {click: a, long_click: select_all}
      - {click: s, long_click: "/"}
      - {click: d, long_click: "\\"}
      - {click: f, long_click: "°"}
      - {click: g, long_click: "℃", swipe_down: date_time}
      - {click: h, long_click: "…"}
      - {click: j, long_click: "'"}
      - {click: k, long_click: "["}
      - {click: l, long_click: "]"}
      - {click: Right, popup: [Reset, Backward], width: 5, key_back_color: *透明, key_border: 0}
    #第三行
      - {click: Shift_L, long_click: Shift_L, label_symbol: ' ', composing: delimiter, swipe_up: RepeatCommit, width: 12}
      - {click: z, long_click: "`", width: 11}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste, width: 11}
      - {click: b, long_click: "="}
      - {click: n, long_click: ";"}
      - {click: m, long_click: "-", width: 11}
      - {click: BackSpace, swipe_up: Escape, swipe_down: Delete, swipe_left: Clear, width: 15}
    #第四行
      - {click: Keyboard_number, popup: [CALCULATOR, Netdisk, TrimeWiki, Nightly, TrimeApp, MT, File_explorer, Weixin, Alipay, Jingdong, huibao, Taobao, Hand_writing, Notes, Bing], width: 15}
      - {click: ",", label: " ，️", swipe_up: "?", width: 12}
      - {click: space, hint: 中, key_hint_offset_x: 75, swipe_up: Up, swipe_down: Down, swipe_left: Left, swipe_right: Right, width: 46}
      - {click: ".", label: " 。", swipe_up: "!", width: 12}
      - {click: Return, popup: [Theme_settings, set_theme], width: 15, __include: /preset_color_schemes/default/blue_key}
    name: "26键默认布局"

  ascii:
    ascii_mode: 1
    lock: false
    __include: /preset_keyboards/default
    __patch: 
      "keys/@32/hint": "\uE073"
      "ascii_keyboard": ~
    name: "26键英文字母"

  wubi86_double_key:
    author: "讲文明"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: ascii
    width: 20
    key_symbol_offset_x: 24
    label_transform: uppercase  #大写标签 小写none
    lock: true
    keys: 
    #第一行
      - {click: q, label: "Q   W", long_click: "_", swipe_right: w, swipe_down: 1, key_text_size: 22}
      - {click: e, label: "E   R", long_click: "～", swipe_right: r, swipe_down: 2, key_text_size: 22}
      - {click: t, label: "T   Y", long_click: "…", swipe_up: Time, swipe_right: y, swipe_down: 3, key_text_size: 22}
      - {click: u, label: "U   I", long_click: ":", swipe_right: i, swipe_down: 4, key_text_size: 22}
      - {click: o, label: "O   P", long_click: "、", swipe_right: p, swipe_down: 5, key_text_size: 22}
    #第二行
      # - {width: 5}
      - {click: Left, popup: [Pin, Forward], width: 5, key_back_color: *透明, key_border: 0, key_border: 0}
      - {click: a, label: "A   S", long_click: "(){Left}", swipe_right: s, swipe_down: 6, width: 18, key_text_size: 22}
      - {click: d, label: "D   F", long_click: "@", swipe_up: Date, swipe_right: f, swipe_down: 7, width: 18, key_text_size: 22}
      - {click: g, label: "G   H", long_click: '"', swipe_right: h, swipe_down: 8, width: 18, key_text_size: 22}
      - {click: j, label: "J   K", long_click: "/", swipe_up: ChineseDate, swipe_right: k, swipe_down: 9, width: 18, key_text_size: 22}
      - {click: l, long_click: "#", swipe_left: Ⅰ, swipe_right: Ⅱ, swipe_down: 0, width: 17}
      - {click: Right, popup: [Reset, Backward], width: 5, key_back_color: *透明, key_border: 0}
      # - {width: 5}
    #第三行
      - {click: Shift_L, long_click: Shift_L, label_symbol: ' ', composing: delimiter, swipe_up: RepeatCommit, swipe_down: Tab, width: 14}
      - {click: x, label: "Z   X", long_click: cut, swipe_left: z, swipe_up: cut_all, width: 18, key_text_size: 22}
      - {click: c, label: "C   V", long_click: copy, swipe_up: copy_all, swipe_right: v, width: 18, key_text_size: 22}
      - {click: b, label: "B   N", long_click: paste, swipe_up: clipboard_window, swipe_right: n, width: 18, key_text_size: 22}
      - {click: m, long_click: select_all, swipe_up: Page_Down, swipe_down: Page_Up, width: 16, key_symbol_offset_x: 21}
      - {click: BackSpace, swipe_up: Escape, swipe_down: Delete, swipe_left: Clear, width: 16}
    #第四行
      - {click: Keyboard_number, popup: [CALCULATOR, Netdisk, TrimeWiki, Nightly, TrimeApp, MT, File_explorer, Weixin, Alipay, Jingdong, huibao, Taobao, Hand_writing, Notes, Bing], width: 14}
      - {click: ",", label: " ，️", swipe_up: "?", width: 14, key_text_size: 18}
      - {click: space, width: 42}
      - {click: ".", label: " 。", swipe_up: "!", width: 14, key_text_size: 18}
      - {click: Return, popup: [Theme_settings, set_theme], width: 16, __include: /preset_color_schemes/default/blue_key}
    name: "五笔86双键"

  pinyin_jiugong:
    author: "Uncle光"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: ascii
    width: 22
    key_symbol_offset_x: 30
    lock: true
    keys:
    #第一行
      - {click: ";", long_click: "[", width: 17, key_symbol_offset_x: 20}
      - {click: 1, label: "分词", long_click: "]", composing: delimiter}
      - {click: 2, label: abc, long_click: "'"}
      - {click: 3, label: def, long_click: "`"}
      - {click: Mode_switch0, popup: [CALCULATOR, Netdisk, TrimeWiki, Nightly, TrimeApp, MT, File_explorer, Weixin, Alipay, Jingdong, huibao, Taobao, Hand_writing, Notes, Bing], width: 17}
    #第二行
      - {click: "-", long_click: "=", width: 17, key_symbol_offset_x: 20}
      - {click: 4, label: ghi, long_click: Home}
      - {click: 5, label: jkl, long_click: select_all}
      - {click: 6, label: mno, long_click: End}
      - {click: Shift_L, long_click: Shift_L, label_symbol: " ", swipe_up: RepeatCommit, width: 17}
    #第三行
      - {click: "/", long_click: "\\", width: 17, key_symbol_offset_x: 20}
      - {click: 7, label: pqrs, long_click: copy}
      - {click: 8, label: tuv, long_click: paste}
      - {click: 9, label: wxyz, long_click: cut}
      - {click: BackSpace, swipe_up: Escape, swipe_down: Delete, swipe_left: Clear, width: 17}
    #第四行
      - {click: ",", label: " ，️", popup: [Pin, Reset], swipe_up: "?", width: 17}
      - {click: ".", label: " 。", popup: [Forward, Backward], swipe_up: "!"}
      - {click: space, swipe_up: Up, swipe_down: Down, key_text_size: 15}
      - {click: 0, popup: ["{}{Left}", "(){Left}", "[]{Left}"]}
      - {click: Return, popup: [Theme_settings, set_theme], width: 17, __include: /preset_color_schemes/default/blue_key}
    name: "拼音九宫"

  number:
    ascii_mode: 1
    lock: false
    __include: /preset_keyboards/pinyin_jiugong
    __patch: 
      "keys/@4/click": Keyboard_ascii
      "keys/@7/swipe_right": ':'
      "keys/@15":
        click: Keyboard_default
        width: 17
      "keys/@16/click": ','
      "keys/@17":
        click: '0'
        popup: ["{}{Left}", "(){Left}", "[]{Left}"]
        swipe_down: space
        hint: "\uE182"
      "keys/@18/click": '.'
    name: "数字"

  layout:
    author: "讲文明"
    ascii_mode: 0
    width: 23
    height: 19
    horizontal_gap: 24
    vertical_gap: 8
    key_text_offset_y: -5
    lock: false
    keys: 
      - {width: 100, height: 3}
      - {width: 3.5}
      - {click: wubi86_scheme, hint: 五笔, key_text_size: 33}
      - {click: wubi86_double_key_scheme, hint: 双键五笔, key_text_size: 32}
      - {click: pinyin_jiugong_scheme, hint: 九宫拼音, key_text_size: 33}
      - {click: pinyin_scheme, hint: 拼音, key_text_size: 33}
      - {width: 100, height: 19}
      - {width: 38}
      - {click: Keyboard_default, label: "\uE04A", height: 20, key_text_offset_y: 1, key_border: 0, round_corner: 33}
      - {width: 100, height: 6}
    name: "键盘布局"

  symbols:
    author: "暖暖"
    ascii_mode: 0
    width: 12.5
    key_symbol_offset_x: -1
    keys: 
      - {click: 符号, long_click: 一, key_text_size: "16"}
      - {click: 电脑, long_click: 二, key_text_size: "16"}
      - {click: 天气, long_click: 三, key_text_size: "16"}
      - {click: 音乐, long_click: 四, key_text_size: "16"}
      - {click: 单位, long_click: 五, key_text_size: "16"}
      - {click: 数学, long_click: 分数, key_text_size: "16"}
      - {click: 八卦, long_click: 易经, key_text_size: "16"}
      - {click: 希腊, long_click: 希腊大写, key_text_size: "16"}
      - {click: 星号, long_click: 六, key_text_size: "16"}
      - {click: 方块, long_click: 七, key_text_size: "16"}
      - {click: 几何, long_click: 八, key_text_size: "16"}
      - {click: 箭头, long_click: 九, key_text_size: "16"}
      - {click: 货币, long_click: 十, key_text_size: "16"}
      - {click: 下标, long_click: 上标, key_text_size: "16"}
      - {click: 天体, long_click: 星座, key_text_size: "16"}
      - {click: 罗马, long_click: 罗马小写, key_text_size: "16"}
      - {click: 标点, long_click: 零, key_text_size: "16"}
      - {click: 拼音, long_click: 竖标点, key_text_size: "16"}
      - {click: 注音, long_click: 偏旁, key_text_size: "16"}
      - {click: 韩文, long_click: 表情, key_text_size: "16"}
      - {click: 假名, long_click: 片假名, key_text_size: "16"}
      - {click: 麻将, long_click: 骰子, key_text_size: "16"}
      - {click: 象棋, long_click: 扑克, key_text_size: "16"}
      - {click: 俄语, long_click: 俄语大写, key_text_size: "16"}
      - {click: Keyboard_default, height: 24, width: 25}
      - {click: Keyboard_number, width: 25}
      - {click: space1, width: 25}
      - {click: BackSpace, swipe_up: Escape, swipe_left: Clear, width: 25}
    name: "扩展符号"

preset_keys:
#安卓
  BRIGHTNESS_DOWN: {label: 亮度-, send: BRIGHTNESS_DOWN}
  BRIGHTNESS_UP: {label: 亮度+, send: BRIGHTNESS_UP}
  CALCULATOR: {label: "\uE139", send: CALCULATOR}#计算器
  CALENDAR: {label: 日历, send: CALENDAR}
  CONTACTS: {label: 电话簿, send: CONTACTS}
  ENVELOPE: {label: 信箱, send: ENVELOPE}
  EXPLORER: {label: 浏览器, send: EXPLORER}
  MUSIC: {label: 音乐, send: MUSIC}
  POWER: {label: 电源, send: POWER}
  SEARCH: {label: 搜寻, send: SEARCH}
  SLEEP: {label: 休眠, send: SLEEP}
  VOICE_ASSIST: {label: 语音, functional: true, send: VOICE_ASSIST}
  VOLUME_DOWN: {label: 音量-, send: VOLUME_DOWN}
  VOLUME_UP: {label: 音量+, send: VOLUME_UP}
  VOLUME_MUTE: {label: 静音, send: VOLUME_MUTE}
  
#编辑
  Shift_L: {label: "\uE1B2", functional: true, send: Shift_L, shift_lock: long} #long中英状态长按锁定｜ascii_long英文長按中文單按鎖定｜click單按鎖定
  Shift_L2: {label: "\uE186", functional: true, send: Shift_L, shift_lock: long}
  Shift_L3: {functional: true, send: Shift_L, shift_lock: click} #供双击使用，仅shift_lock: click支持双击
  Return: {label: "\uE034", functional: false, send: Return} 
  Return1: {label: "\uE031",  functional: false, send: Return}
  Hide: {label: "\uE0D7", send: BACK}
  BackSpace: {label: "\uE040", repeatable: true, functional: true, slide_delete: false, send: BackSpace}
  space: {label: "\uE183", repeatable: false, preview: "\uE182", functional: false, slide_cursor: true, send: space}
  space1: {label: "\uE182", repeatable: false, functional: true, slide_cursor: true, send: space}
  Clear: {label: "\uE048", text: "{Control+a}{BackSpace}"}
  Escape: {label: "\uE045", functional: false, send: Escape}
  Home: {label: "\uE0c5", send: Control+Home, functional: false}
  End: {label: "\uE0d5", send: Control+End, functional: false}
  Page_Up: {label: "\uE0cd", send: Page_Up, functional: false}
  Page_Down: {label: "\uE0dd", send: Page_Down, functional: false}
  Left1: {label: '⇦', send: Control+Left, repeatable: true, functional: false}
  Right1: {label: '⇨', send: Control+Right, repeatable: true, functional: false}
  Left: {label: '‹', send: Left, repeatable: false, functional: false}
  Right: {label: '›', send: Right, repeatable: false, functional: false}
  Down: {label: '↓', send: Down, repeatable: true, functional: false}
  Up: {label: '↑', send: Up, repeatable: true, functional: false}
  select_all: {label: "☑", functional: false, send: Control+a}
  cut: {label: "✁", functional: false, send: Control+x}
  copy: {label: "❐", functional: false, send: Control+c}
  paste: {label: "⎗", functional: false, send: Control+v}
  cut_all: {label: "☑✁", text: "{Control+a}{Control+x}"}
  copy_all: {label: "☑❐", text: "{Control+a}{Control+c}"}
  redo: {label: "\uE02F", functional: false, send: Control+Shift+z} #>=Android 6.0
  undo: {label: "\uE02E", functional: false, send: Control+z} #>=Android 6.0
  Tab: {label: Tab, repeatable: false, text: '	'}
  Insert: {label: "⌤", send: Insert}
  Delete: {label: "⌦", send: Delete, functional: false}
  delimiter: {label: "'", text: "'"}
  Forward: {label: 前移, send: Control+j}
  Backward: {label: 后移, send: Control+k}
  Pin: {label: 置顶, send: Control+p}
  Reset: {label: 重置, send: Control+l}
  无能键: {send: ""}

#rime组合键
  F4: {label: 方案菜单, send: F4}
  BackToPreviousSyllable: {label: 删音节, send: Control+BackSpace}
  CommitRawInput: {label: 编码, send: Control+Return} #上屏原始输入
  CommitScriptText: {label: 编码, send: Shift+Return} #上屏变换后输入
  CommitComment: {label: 编码, send: Control+Shift+Return} #上屏候选提示
  DeleteCandidate: {label: 删词, send: Control+Delete, functional: false}
  RepeatCommit: {label: "\uE18A", command: commit, option: "%1$s"} #重拨

#切换键盘
  Keyboard_layout: {label: "\uE101", functional: false, send: Eisu_toggle, select: layout}
  Keyboard_pinyin_jiugong: {label: "\uE10E", functional: false, send: Eisu_toggle, select: pinyin_jiugong}
  Keyboard_wubi86_double_key: {label: "\uE10D", functional: false, send: Eisu_toggle, select: wubi86_double_key}
  Keyboard_ascii: {label: abc, functional: true, send: Eisu_toggle, select: .ascii}
  Keyboard_default: {label: "\uE030", functional: true, send: Eisu_toggle, select: .default}
  Keyboard_switch: {label: 键盘, functional: true, send: Eisu_toggle, select: .next}
  Keyboard_number: {label: 123, preview: "\uE012", functional: true, send: Eisu_toggle, select: number}
  Keyboard_symbols: {label: "\uE01C", functional: true, send: Eisu_toggle, select: symbols}
  Keyboard_next: {label: 后退, functional: false, send: Eisu_toggle, select: .next}
  Keyboard_last: {label: 返回, functional: false, send: Eisu_toggle, select: .last}
  Keyboard_last_lock: {label: "\uE073", send: Eisu_toggle, select: .last_lock}
  liquid_keyboard_exit: {label: "   \uE030   ", send: FUNCTION, command: liquid_keyboard, option: "-1"}
  liquid_keyboard_ascii: {label: "\uE018", send: FUNCTION, command: liquid_keyboard, option: "英文"}
  liquid_keyboard_tabs: {label: "  \uE12f  ", send: FUNCTION, command: liquid_keyboard, option: "更多"}
  liquid_keyboard_symbollist: {label: 扩符, send: FUNCTION, command: liquid_keyboard, option: "扩符"}
  liquid_keyboard_backspace: {label: "   \uE040   ", repeatable: true, functional: true, slide_delete: false, send: BackSpace}
  liquid_keyboard_return: {label: "   \uE034   ", functional: false, send: Return} 
  liquid_keyboard_clipboard: {label: "   \uE099   ", send: FUNCTION, command: "clipboard_window", option: '0'}
  menu_keyboard: {label: "\uE03E", send: FUNCTION, command: menu_keyboard}
  clipboard_window: {label: "\uE099", send: FUNCTION, command: "clipboard_window", option: '0'} #0剪贴板
  favorites: {label: "\uE099", send: FUNCTION, command: "clipboard_window", option: '1'} #1收藏夹

#rime状态
  Mode_switch0: {toggle: ascii_mode, functional: true, send: SWITCH_CHARSET, states: [123, 中]}
  Mode_switch: {toggle: ascii_mode, functional: false, send: SWITCH_CHARSET, states: [中, En]}
  Zenkaku_Hankaku: {toggle: full_shape, send: SWITCH_CHARSET, states: [半角, 全角]}
  Henkan: {toggle: simplification, send: SWITCH_CHARSET, states: [汉字, 漢字]}
  Charset_switch: {toggle: charset_filter, send: SWITCH_CHARSET, states: [常用, 扩展]}
  Punct_switch: {toggle: ascii_punct, send: SWITCH_CHARSET, states: [。，, ．，]}
  orientation_switch: {toggle: _linear, send: SWITCH_CHARSET, states: [纵向, 横向]}
  Spell_switch: {toggle: 86wubi_spelling, send: SWITCH_CHARSET, states: [拆, 扌斥]}

#trime设置
  IME_switch: {label: "\uE101", send: LANGUAGE_SWITCH} #彈出對話框選擇輸入法
  IME_last: {label: 上一输入法, send: LANGUAGE_SWITCH, select: .last} #直接切換到上一輸入法
  IME_next: {label: 下一输入法, send: LANGUAGE_SWITCH, select: .next} #直接切換到下一輸入法
  Schema_switch: {label: 下一方案, functional: false, send: Control+Shift+1}
  Schema_Eng: {label: En, functional: true, send: Control+Shift+0}
  Theme_settings: {label: "\uE131", send: SETTINGS, option: "theme"}
  Color_switch: {label: "\uE136", functional: false, send: PROG_RED}
  Help: {label: "\uE129", send: HELP}
  Info: {label: "\uE3c6", send: INFO} #关于
  Menu: {label: "\uE129", functional: false, send: MENU}
  Settings: {label: "\uE120", functional: false, send: SETTINGS}
  Deploy: {label: "\uE18B", send: FUNCTION, command: apply, option: "DEPLOY"}
  Sync: {label: 同步, send: FUNCTION, command: apply, option: "SYNC_USER_DATA"}
  UpdateConfig: {label: "\uE196", send: FUNCTION, command: apply, option: "UPDATE_CONFIG"}
  # set_color_default: {label: 标配, send: FUNCTION, command: set_color_scheme, option: "default"}
  set_theme: {label: "\uE189", send: FUNCTION, command: set_theme, option: ""} #空参数刷新主题
  pinyin_scheme: {label: "\uE107", send: Shift+Control+6}  #一键切拼音方案
  wubi86_scheme: {label: "\uE109", send: Shift+Control+7}  #一键切五笔方案
  wubi86_double_key_scheme: {label: "\uE10D", send: Shift+Control+8}  #一键切双键五笔方案
  pinyin_jiugong_scheme: {label: "\uE10E", send: Shift+Control+9}  #一键切九宫拼音方案

